<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnMyWay — You're Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #1e1b4b 0%, #2e1065 50%, #0f172a 100%);
        color: #e2e8f0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #a78bfa, #4338ca);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        background: linear-gradient(90deg, #c4b5fd, #f9a8d4, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.75rem;
      }

      p {
        color: #94a3b8;
        font-size: 1rem;
        line-height: 1.6;
        max-width: 380px;
        margin: 0 auto 0.5rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1.75rem;
        padding: 0.5rem 1.25rem;
        background: rgba(167, 139, 250, 0.1);
        border: 1px solid rgba(167, 139, 250, 0.3);
        border-radius: 9999px;
        font-size: 0.875rem;
        color: #c4b5fd;
      }

      .pill svg { width: 16px; height: 16px; }

      button {
        margin-top: 1.5rem;
        padding: 0.65rem 1.75rem;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #7c3aed, #4338ca);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
        transition: opacity 0.2s;
      }
      button:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="logo">🎓</div>
    <h1>You're offline</h1>
    <p>LearnMyWay requires an internet connection to generate AI-powered lessons and sync your progress.</p>
    <p>Connect to the internet and try again.</p>

    <div class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
      No internet connection
    </div>

    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
